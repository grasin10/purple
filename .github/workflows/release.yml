name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Pick release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./package.json').version")
            echo "name=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Krypt Trader ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          body: |
            Windows installer for Krypt Trader. Download the `.exe` below and run it.

            The build isn't code-signed, so Windows may show a SmartScreen prompt on first launch —
            click **More info → Run anyway**. The app starts in demo + dry-run, so nothing trades
            with real money until you turn both off.
