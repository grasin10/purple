<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JARVIS login</title>
<style>body{font:16px system-ui,sans-serif;background:#0f1216;color:#e8ecf0;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}
form{background:#171b21;padding:24px;border-radius:12px;width:100%;max-width:340px;border:1px solid #2a3038}input,button{width:100%;padding:10px;margin-top:10px;border-radius:8px;font:inherit;border:1px solid #2a3038;background:#0f1216;color:inherit}button{background:#2457d6;border:0;color:#fff}.e{color:#ff7a6e}</style></head>
<body><form method="post" action="/login"><b>JARVIS</b>
{% if error %}<p class="e">{{ error }}</p>{% endif %}
<input type="password" name="password" placeholder="Dashboard password" autocomplete="current-password" required autofocus>
<button>Sign in</button></form></body></html>
