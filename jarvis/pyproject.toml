[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.2.0"
description = "JARVIS - personal AI business operating system (junk removal + home cleaning first)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "google-auth-oauthlib>=1.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
